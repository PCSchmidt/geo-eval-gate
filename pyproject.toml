[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo-eval-gate"
version = "0.1.0"
description = "Evaluator-gated geospatial change detection: deterministic NDVI/SSIM screening, VLM taxonomy verification behind a schema and confidence gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PCSchmidt" }]
dependencies = ["numpy>=1.26", "scipy>=1.12", "pydantic>=2.6"]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
real = ["pyarrow>=15", "pillow>=10", "matplotlib>=3.8", "scikit-learn>=1.4"]
vlm = ["transformers>=4.40", "torch>=2.2", "pillow>=10"]
dev = ["pytest>=8", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/geo_eval_gate"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "scipy.*", "transformers.*", "torch.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
